name: build map data

# Rebuilds the GOIT and GGIT interim-map geojsons and publishes them by
# force-pushing a single-commit orphan branch (`map-data`) of THIS repo, which
# goit-ggit-interim-maps fetches at runtime via raw.githubusercontent.com
# (free, CORS-enabled, ~5 min cache). The force-push keeps the branch at one
# commit so repo history never grows with data. Both maps build in one job:
# the branch is replaced wholesale each publish, so publishing one file alone
# would delete the other.
#
# Triggers:
#  - repository_dispatch 'routes-normalized': fired by the normalize-routes
#    workflow in goit-ggit-pipeline-routes after it pushes a new `normalized`
#    branch (i.e. route geometries changed)
#  - schedule: daily, so sheet-only edits (which never touch the routes repo)
#    still reach the map within a day
#  - workflow_dispatch: manual runs; `upload: false` builds without
#    publishing, `dest_branch` can point at a test branch
#
# Secrets: GDRIVE_API_CREDENTIALS (Google service-account JSON, read by
# pygsheets). Publishing needs no secret — GITHUB_TOKEN pushes to this repo.

on:
  repository_dispatch:
    types: [routes-normalized]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      dest_branch:
        description: 'branch to publish the map geojson to'
        default: map-data
      upload:
        description: 'publish the result (uncheck for a dry run)'
        type: boolean
        default: true

permissions:
  contents: write

# Coalesce rapid route pushes: a newer trigger cancels an in-flight build.
concurrency:
  group: build-map-data
  cancel-in-progress: true

jobs:
  build-goit-map:
    runs-on: ubuntu-latest
    steps:
      - name: log trigger
        run: |
          echo "event: ${{ github.event_name }}"
          echo "routes sha: ${{ github.event.client_payload.routes_sha }}"

      - uses: actions/checkout@v4

      - name: checkout normalized routes
        uses: actions/checkout@v4
        with:
          repository: GlobalEnergyMonitor/goit-ggit-pipeline-routes
          ref: normalized
          path: pipeline-routes-normalized

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: releases/downloads/requirements.txt

      - name: install dependencies
        run: |
          pip install -r releases/downloads/requirements.txt
          pip install ./gem-tracker-constants

      - name: build goit map geojson
        env:
          GDRIVE_API_CREDENTIALS: ${{ secrets.GDRIVE_API_CREDENTIALS }}
        run: |
          python releases/downloads/pipeline_exports.py \
            --pipeline-type Oil-NGL --simplify-fuels Oil-and-NGL \
            --routes-path pipeline-routes-normalized/data/individual-routes \
            --map-only --map-output out/goit_map_latest.geojson

      - name: build ggit map geojson
        env:
          GDRIVE_API_CREDENTIALS: ${{ secrets.GDRIVE_API_CREDENTIALS }}
        run: |
          python releases/downloads/pipeline_exports.py \
            --pipeline-type Gas --simplify-fuels Gas \
            --routes-path pipeline-routes-normalized/data/individual-routes \
            --map-only --map-output out/ggit_map_latest.geojson

      - uses: actions/upload-artifact@v4
        with:
          name: map-geojsons
          path: out/*.geojson
          retention-days: 5

      - name: publish to map-data branch
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
        env:
          DEST_BRANCH: ${{ inputs.dest_branch || 'map-data' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b "$DEST_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./*.geojson
          git commit -q -m "map data build (${GITHUB_SHA::7}, ${{ github.event_name }})"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${DEST_BRANCH}"
          for f in *.geojson; do
            echo "published: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DEST_BRANCH}/${f}"
          done
